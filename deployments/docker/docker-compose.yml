version: "3.8"

services:
  # PostgreSQL - Single database for all data (PoC architecture)
  postgres:
    image: postgres:16-alpine
    container_name: pg-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: productgraph
      POSTGRES_USER: pg
      POSTGRES_PASSWORD: pg
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pg -d productgraph"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
