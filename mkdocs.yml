site_name: ProductGraph
site_description: AI-native runtime product intelligence platform
site_url: https://plexusone.github.io/productgraph
repo_url: https://github.com/plexusone/productgraph
repo_name: plexusone/productgraph

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Dark mode first (PlexusOne default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - https://plexusone.dev/css/plexusone-mkdocs.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Quick Start: getting-started/quickstart.md
      - Installation: getting-started/installation.md
  - Architecture:
      - Overview: architecture/overview.md
      - Scaling Guide: architecture/scaling.md
  - API Reference:
      - Event Ingestion: api/events.md
  - Design:
      - Product Requirements: design/prd.md
      - Ideation: design/ideation.md
  - Releases:
      - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/plexusone/productgraph
